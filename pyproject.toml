[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financebench-rag"
version = "0.1.0"
description = "A modular Retrieval-Augmented Generation system for FinanceBench."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pandas",
    "numpy",
    "torch",
    "sentence-transformers",
    "langchain",
    "langchain-community",
    "langchain-openai",
    "faiss-cpu",
    "python-dotenv",
    "openai",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "api*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "black",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
