[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financebench-rag"
version = "0.1.0"
description = "A modular Retrieval-Augmented Generation system for FinanceBench."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # API
    "fastapi>=0.140",
    "uvicorn[standard]>=0.51",

    # LLM / RAG
    "langchain>=1.3",
    "langchain-core>=1.5",
    "langchain-community>=0.4",
    "langchain-openai>=1.3",
    "langchain-text-splitters>=1.1",
    "langchain-huggingface",

    # Embeddings & Retrieval
    "sentence-transformers>=5.6",
    "faiss-cpu>=1.11",
    "torch>=2.7",
    "transformers>=4.56",

    # OpenAI
    "openai>=2.46",
    "tiktoken>=0.13",

    # Data processing
    "numpy>=2.3",
    "pandas>=3.0",
    "scikit-learn>=1.7",
    "pypdf>=6.1",

    # Configuration
    "python-dotenv>=1.2",

    # Validation
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "api*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.12",
    "black>=25.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.ruff.lint.per-file-ignores]
"api/routes.py" = ["B008"]


